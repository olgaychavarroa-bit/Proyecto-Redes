# Cada listener utiliza su propia configuración de autenticación.
per_listener_settings true

persistence true
persistence_location /mosquitto/data/

log_dest stdout


# ============================================================
# MQTT tradicional autenticado, sin TLS
# Se mantiene temporalmente durante las pruebas.
# ============================================================

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd


# ============================================================
# MQTT estable protegido mediante TLS
# Backend, Urgencias y Laboratorio continúan aquí.
# ============================================================

listener 8883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd

certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

tls_version tlsv1.2
require_certificate false


# ============================================================
# Piloto API Key + MQTT protegido mediante TLS
# Inicialmente utilizado solo por UCI.
# ============================================================

listener 8884 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd-api-key-piloto

certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

tls_version tlsv1.2
require_certificate false
