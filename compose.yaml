name: proyecto-redes

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    restart: always

    ports:
      - "1883:1883"
      - "8883:8883"

    volumes:
      - ./broker/config:/mosquitto/config
      - ./broker/data:/mosquitto/data
      - ./broker/log:/mosquitto/log
      - ./broker/certs/server/server.crt:/mosquitto/certs/server.crt:ro
      - ./broker/certs/server/server.key:/mosquitto/certs/server.key:ro

    networks:
      - appnet

  postgres:
    image: postgres:18
    container_name: iot-postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./database/pgdata:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro

    networks:
      - appnet

  backend:
    build:
      context: ./backend

    image: iot-backend-image:1.0
    container_name: iot-backend
    restart: always

    env_file:
      - ./.env

    volumes:
      - ./broker/certs/ca/ca.crt:/app/certs/ca.crt:ro

    ports:
      - "5000:5000"

    depends_on:
      - mosquitto
      - postgres

    networks:
      - appnet

  dashboard:
    build:
      context: ./dashboard

    image: iot-dashboard-image:1.1
    container_name: iot-dashboard
    restart: always

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - appnet

networks:
  appnet:
    name: appnet
    driver: bridge
